name: CI/CD Pipeline - Cloud Run Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY || 'fitoherb-repo' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'fitoherb-sales-predictor' }}
  IMAGE_NAME: ${{ vars.GCP_REGION || 'southamerica-east1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY || 'fitoherb-repo' }}/${{ vars.CLOUD_RUN_SERVICE || 'fitoherb-sales-predictor' }}

jobs:
  test-and-lint:
    name: 🧪 CI - Testes e Validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências e Validar Build Angular
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configurar Python (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock httpx

      - name: Executar Testes Unitários de API e Domínio
        run: |
          pytest tests/test_auth.py tests/test_elasticity_model.py tests/trend_insights tests/sales_trend tests/analytics -v

  build-and-deploy:
    name: 🚀 CD - Build & Deploy Cloud Run
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Mandatório para Workload Identity Federation (WIF) OIDC

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (WIF ou Service Account Key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Se WIF_PROVIDER estiver configurado nos secrets, utiliza autenticação moderna sem chaves (OIDC)
          # Caso contrário, utiliza a chave JSON tradicional de Service Account (GCP_SA_KEY)
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Autenticação Docker com Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem de Contêiner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy no Google Cloud Run (FinOps Scale-to-Zero)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_REQUIRED: ${{ secrets.AUTH_REQUIRED || 'true' }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'fitoherb' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'Fito1997@' }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GAR_LOCATION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --cpu-throttling \
            --memory=2Gi \
            --concurrency=80 \
            --timeout=300 \
            --set-env-vars="ENV=production,ENVIRONMENT=production,AUTH_REQUIRED=${AUTH_REQUIRED},AUTH_USERNAME=${AUTH_USERNAME},AUTH_PASSWORD=${AUTH_PASSWORD},DB_HOST=${DB_HOST},DB_PORT=${DB_PORT},DB_NAME=${DB_NAME},DB_USER=${DB_USER},DB_PASSWORD=${DB_PASSWORD},DB_SCHEMA=Externo01,DB_DRIVER=ODBC Driver 17 for SQL Server"

      # F7 (Tendencia com IA): somente variaveis NAO secretas. So roda depois que a infra
      # (infra/trend-insights/01..04) existir e a variavel de repositorio TREND_INSIGHTS_BUCKET for definida.
      # Passo separado porque o delimitador "^;;^" e necessario (o JSON de precos contem virgulas) e
      # --set-env-vars/--update-env-vars sao mutuamente exclusivos no gcloud.
      - name: Configurar variaveis da F7 - Tendencia com IA (nao secretas)
        if: ${{ vars.TREND_INSIGHTS_BUCKET != '' }}
        env:
          F7_BUCKET: ${{ vars.TREND_INSIGHTS_BUCKET }}
          F7_AI_ENABLED: ${{ vars.TREND_AI_ENABLED || 'true' }}
          F7_AI_LOCATION: ${{ vars.TREND_AI_LOCATION || 'us-central1' }}
          F7_MONTHLY_BUDGET: ${{ vars.TREND_AI_MONTHLY_BUDGET_USD || '1.80' }}
          F7_DAILY_BUDGET: ${{ vars.TREND_AI_DAILY_BUDGET_USD || '0.20' }}
          F7_MODEL_RADAR: ${{ vars.TREND_AI_MODEL_RADAR || 'gemini-4-hydrogen' }}
          F7_GROUNDING_CAP: ${{ vars.TREND_AI_GROUNDING_HARD_CAP_QUERIES || '1500' }}
          F7_GROUNDING_FREE: ${{ vars.TREND_AI_GROUNDING_FREE_QUERIES || '1500' }}
          F7_DEADLINE: ${{ vars.TREND_AI_LLM_TOTAL_DEADLINE_SECONDS || '125' }}
          F7_LOCK_TTL: ${{ vars.TREND_AI_IN_FLIGHT_LOCK_TTL_SECONDS || '150' }}
          F7_INVOKER_SA: ${{ vars.AFFINITY_SYNC_INVOKER_SA }}
          F7_RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.GAR_LOCATION }} --format='value(status.url)')
          PRICING=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' infra/trend-insights/pricing.json)
          SA_FLAG=""
          if [ -n "${F7_RUNTIME_SA}" ]; then SA_FLAG="--service-account=${F7_RUNTIME_SA}"; fi
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GAR_LOCATION }} ${SA_FLAG} \
            --update-env-vars="^;;^GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }};;TREND_INSIGHTS_BUCKET=${F7_BUCKET};;AFFINITY_INDEX_GCS_URI=gs://${F7_BUCKET}/affinity/product_affinity_index.json;;AFFINITY_SYNC_AUDIENCE=${SERVICE_URL};;AFFINITY_SYNC_INVOKER_SA=${F7_INVOKER_SA};;TREND_AI_ENABLED=${F7_AI_ENABLED};;TREND_AI_LOCATION=${F7_AI_LOCATION};;TREND_AI_MODEL_DEFAULT=gemini-4-hydrogen;;TREND_AI_MODEL_FALLBACK=gemini-3.8-flash;;TREND_AI_MONTHLY_BUDGET_USD=${F7_MONTHLY_BUDGET};;TREND_AI_DAILY_BUDGET_USD=${F7_DAILY_BUDGET};;TREND_AI_MODEL_RADAR=${F7_MODEL_RADAR};;TREND_AI_GROUNDING_HARD_CAP_QUERIES=${F7_GROUNDING_CAP};;TREND_AI_GROUNDING_FREE_QUERIES=${F7_GROUNDING_FREE};;TREND_AI_LLM_TOTAL_DEADLINE_SECONDS=${F7_DEADLINE};;TREND_AI_IN_FLIGHT_LOCK_TTL_SECONDS=${F7_LOCK_TTL};;TREND_AI_PRICING_JSON=${PRICING}"
