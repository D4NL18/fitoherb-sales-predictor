<header class="platform-navbar">
  <div class="navbar-container">
    <div class="platform-brand">
      <img
        src="/assets/images/fitoherb-logo.png"
        alt="Fitoherb Nordeste"
        class="platform-logo"
        draggable="false"
      />
    </div>

    <div class="brand-divider" aria-hidden="true"></div>

    <!-- Botão Hambúrguer Mobile -->
    <button 
      type="button" 
      class="mobile-menu-toggle" 
      (click)="toggleMobileMenu()" 
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-label="Alternar menu de navegação"
    >
      @if (isMobileMenuOpen()) {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      } @else {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      }
    </button>

    <!-- Navegação de Serviços da Plataforma -->
    <nav class="platform-nav" [class.mobile-open]="isMobileMenuOpen()" aria-label="Navegação da Plataforma">
      <ul class="nav-list">
        <li class="nav-item">
          <a
            routerLink="/pricing"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
            class="nav-link"
            title="Acessar a Tabela de Preços e Descontos Combinados"
          >
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <span class="nav-label">Preços e Descontos</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/inventory"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
            class="nav-link"
            title="Acessar a Reposição de Estoque e Sugestão de Compras"
          >
            <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span class="nav-label">Estoque e Compras</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="navbar-meta">
      <span class="catalog-status-pill">Catálogo Ativo: 1.398 produtos</span>
    </div>
  </div>
</header>
